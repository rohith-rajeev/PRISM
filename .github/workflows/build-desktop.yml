name: Build desktop executables

# PyInstaller cannot cross-compile, so each OS is built on its own runner.
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Two merges landing on main at once would otherwise race for the same number
# and one of them would lose its tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A merge into main is a release. Everything below happens in this one run
  # on purpose: a push made with GITHUB_TOKEN does not start a new workflow,
  # so tagging in one run and hoping the tag triggers another would publish
  # nothing at all.
  version:
    name: Tag the next version
    # A commit whose message carries "[skip release]" (a docs tweak, a
    # committed asset, anything with nothing to ship) reaches main without
    # being tagged or released - version.py is left exactly as it is.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Work out the next version
        id: plan
        run: |
          set -e
          git fetch --tags --force --quiet
          TAGS=$(git tag -l 'v*' | tr '\n' ' ')
          NEXT=$(TAGS="$TAGS" python -c "
          import os, version
          print(version.next_version(*os.environ['TAGS'].split(), version.__version__))
          ")
          echo "Tags so far: ${TAGS:-none}"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Record it, commit it, tag it
        id: bump
        env:
          NEXT: ${{ steps.plan.outputs.next }}
        run: |
          set -e
          python - <<'PY'
          import os, pathlib, re
          nxt = os.environ["NEXT"]
          p = pathlib.Path("version.py")
          s = p.read_text(encoding="utf-8")
          s, n = re.subn(r'^__version__ = ".*"$', f'__version__ = "{nxt}"', s,
                         flags=re.MULTILINE)
          assert n == 1, f"could not rewrite __version__ ({n} matches)"
          p.write_text(s, encoding="utf-8")
          PY
          # The build below runs from this commit, so what the application
          # reports about itself and what the tag says are the same thing.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.py
          git commit -m "Release v$NEXT"
          git tag -a "v$NEXT" -m "PRISM v$NEXT"
          git push origin HEAD:main
          git push origin "v$NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: [version]
    # `version` is skipped for develop, pull requests and hand-pushed tags,
    # and a skipped dependency would otherwise skip this too.
    if: ${{ always() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact: PRISM-linux-x86_64
          - os: macos-latest
            label: macOS (Apple silicon)
            artifact: PRISM-macos-arm64
          - os: windows-latest
            label: Windows
            artifact: PRISM-windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tkinter (Linux runners ship Python without it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-build.txt

      - name: Sanity-check the sources before packaging
        run: |
          python -m compileall -q app.py orchestrator.py jobs.py updater.py version.py desktop/
          python -c "import ast; [ast.parse(open(f, encoding='utf-8').read()) for f in ('app.py','orchestrator.py','jobs.py','updater.py','version.py')]"

      - name: Unit tests
        # Model, scheduler and engine-protocol tests. No Tk and no network, so
        # they run on every platform's runner before anything is packaged.
        run: python -m unittest discover -s tests -v

      - name: Build
        run: python desktop/build.py

      - name: Verify the bundle contains the reviewer agent
        shell: bash
        run: |
          set -e
          # The agent is the one data file the app cannot work without. macOS
          # builds --onedir (see desktop/build.py), so its data files sit as
          # loose files somewhere under the .app bundle rather than embedded
          # in a single executable blob — check for the file itself there,
          # and fall back to grepping the executable's bytes on Linux/Windows,
          # which still build --onefile.
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -n "$(find dist/PRISM.app -name pr-reviewer.md -print -quit)" \
              || { echo "::error::bundled agent missing from dist/PRISM.app"; exit 1; }
            echo "dist/PRISM.app ok"
          else
            if [ "$RUNNER_OS" = "Windows" ]; then TARGET=dist/PRISM.exe; else TARGET=dist/PRISM; fi
            python - "$TARGET" <<'PY'
          import sys, pathlib
          target = pathlib.Path(sys.argv[1])
          assert target.exists(), f"no executable at {target}"
          blob = target.read_bytes()
          assert b"pr-reviewer" in blob, "bundled agent missing from the executable"
          print(f"{target} ok ({target.stat().st_size / 1048576:.1f} MiB)")
          PY
          fi

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p out
          cp README.md out/
          if [ "$RUNNER_OS" = "macOS" ]; then
            # ditto preserves the bundle's symlinks and permission bits; zip does not.
            ditto -c -k --keepParent dist/PRISM.app "out/${{ matrix.artifact }}.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/PRISM.exe out/
          else
            cp dist/PRISM dist/PRISM.desktop dist/PRISM.png out/
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/
          if-no-files-found: error
          # Old builds expire on their own; with a run per push they otherwise
          # pile up and it stops being obvious which one is current. Anything
          # worth keeping should be a tagged release, which does not expire.
          retention-days: 7

  render:
    name: Render check (${{ matrix.label }})
    # Rendering differences are per-platform — rounded shapes and font metrics
    # that look right on one OS can look wrong on another, and no unit test
    # catches that. This uploads screenshots so a regression is visible.
    # Never blocks a build: a capture failure is not a code failure.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render the screens
        run: python tests/render_scene.py render-out
      - uses: actions/upload-artifact@v4
        # Diagnostics, not a deliverable. Uploaded only when asked for by hand
        # or when something failed, so the artifact list shows the three
        # distributions and nothing else.
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        with:
          name: render-${{ matrix.label }}
          path: render-out/
          if-no-files-found: warn
          retention-days: 3

  release:
    name: Attach builds to the release
    needs: [build, version]
    # Either a tag pushed by hand, or the one the version job just made.
    if: ${{ always() && needs.build.result == 'success'
            && (startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref_name }}
          path: src

      - name: Refuse a tag that disagrees with version.py
        # The updater compares the running build against a release tag, so a
        # build labelled differently from the tag it ships under would either
        # offer an update that is already installed or hide one that is not.
        run: |
          set -e
          WANT="${TAG#v}"
          SRC=$(python -c "import sys; sys.path.insert(0, 'src'); import version; print(version.__version__)")
          echo "tag=$WANT version.py=$SRC"
          test "$WANT" = "$SRC" || {
            echo "::error::tag $TAG does not match version.py ($SRC)"; exit 1; }

      - name: Build the release assets
        # One archive per platform, named for the platform, so the in-app
        # updater can pick the right one by name alone. The loose files the CI
        # artifacts carry are convenient to click through but ambiguous to
        # match against - two of them are just called PRISM.
        run: |
          set -e
          mkdir -p release
          cp artifacts/PRISM-macos-arm64/PRISM-macos-arm64.zip release/
          (cd artifacts/PRISM-windows-x86_64 && zip -q -r ../../release/PRISM-windows-x86_64.zip PRISM.exe)
          tar -czf release/PRISM-linux-x86_64.tar.gz \
              -C artifacts/PRISM-linux-x86_64 PRISM PRISM.desktop PRISM.png
          # Checksums the updater verifies the download against before it
          # replaces anything on disk.
          (cd release && sha256sum PRISM-* > SHA256SUMS)
          cat release/SHA256SUMS
          ls -la release

      - name: Pull this release's notes from CHANGELOG.md
        # Hand-written, not auto-generated: CHANGELOG.md is what a person
        # reads in the in-app "update available" screen, so it says what
        # changed for them rather than listing commits. A tag with no
        # matching section (a changelog entry forgotten before tagging)
        # degrades to a placeholder instead of failing the release.
        run: |
          set -e
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "([ (]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' src/CHANGELOG.md > release/NOTES.md
          if [ ! -s release/NOTES.md ]; then
            echo "_No changelog entry yet for this release._" > release/NOTES.md
          fi
          cat release/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          # Named explicitly: on a merge into main this run is not on a tag
          # ref, so the action cannot infer which tag to publish against.
          tag_name: ${{ env.TAG }}
          name: PRISM ${{ env.TAG }}
          files: release/*
          body_path: release/NOTES.md
